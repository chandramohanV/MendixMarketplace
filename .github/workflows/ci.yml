name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Install Chrome for the browser tests
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Lint, format, typecheck, build and test
        run: npm run check
        env:
          CI: 'true'
          BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
